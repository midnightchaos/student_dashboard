{% extends "base.html" %}
{% block title %}Submit: {{ task.title }}{% endblock %}
{% block content %}
<h1>Submit: {{ task.title }}</h1>
<div class="card" style="max-width:640px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <p>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </p>
    {% endfor %}
    <button class="btn" type="submit">Submit Task</button>
    <a class="btn secondary" href="{% url 'student_task_detail' task.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
